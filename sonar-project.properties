# Configuration de l'analyse SonarQube / SonarCloud.
# Le token (secret SONAR_TOKEN) et l'URL (variable SONAR_HOST_URL, SonarCloud par défaut) viennent de GitHub.

# À adapter : identifiant du projet et organisation SonarCloud
sonar.projectKey=Maanaaa_manora-live-mobile
sonar.projectName=Manora Live — mobile
sonar.organization=maanaaa

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.sourceEncoding=UTF-8

sonar.exclusions=node_modules/**,ios/**,android/**,dist/**,.expo/**,assets/**,**/*.json
